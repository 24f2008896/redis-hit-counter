
services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: "8080"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:

